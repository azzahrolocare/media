<script type="module">
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm/index.min.js";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");
        const statusDiv = document.getElementById("status");
        
        let handLandmarker = undefined;
        let lastVideoTime = -1;

        canvasElement.width = 640;
        canvasElement.height = 480;

        // LANGKAH 1: Langsung minta izin kamera di awal tanpa nunggu AI
        function mintaIzinKameraDulu() {
            statusDiv.innerText = "Meminta akses kamera...";
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
            .then((stream) => {
                video.srcObject = stream;
                statusDiv.innerText = "Kamera diizinkan! Sekarang memuat sistem AI...";
                statusDiv.style.color = "#4af626";
                // Setelah kamera aman, baru load AI-nya
                loadAI();
            })
            .catch((err) => {
                statusDiv.innerText = "Akses kamera ditolak/diblokir oleh browser!";
                statusDiv.style.backgroundColor = "#5a1a1a";
                statusDiv.style.color = "#ff3333";
            });
        }

        // LANGKAH 2: Memuat AI MediaPipe
        async function loadAI() {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
                );
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker_full/float16/1/hand_landmarker_full.task`,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });
                
                // Jika video sudah siap semenjak langkah 1, langsung jalankan deteksi
                if (video.readyState >= 2) {
                    jalankanDeteksi();
                } else {
                    video.addEventListener("loadeddata", jalankanDeteksi);
                }
                statusDiv.innerText = "Semua Siap! Angkat tanganmu ✌️";
                statusDiv.style.backgroundColor = "#1a3a1a";
            } catch (error) {
                statusDiv.innerText = "Gagal memuat AI: " + error;
                statusDiv.style.color = "#ff3333";
            }
        }

        // LANGKAH 3: Loop Deteksi Tangan (Real-time per frame)
        async function jalankanDeteksi() {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                
                const startTimeMs = performance.now();
                const results = handLandmarker.detectForVideo(video, startTimeMs);

                let sedangPeaceSign = false;

                if (results.landmarks && results.landmarks.length > 0) {
                    const landmarks = results.landmarks[0];

                    window.drawConnectors(canvasCtx, landmarks, [{start:0, end:1}, {start:1, end:2}, {start:2, end:3}, {start:3, end:4}, {start:5, end:6}, {start:6, end:7}, {start:7, end:8}, {start:9, end:10}, {start:10, end:11}, {start:11, end:12}, {start:13, end:14}, {start:14, end:15}, {start:15, end:16}, {start:17, end:18}, {start:18, end:19}, {start:19, end:20}, {start:0, end:5}, {start:5, end:9}, {start:9, end:13}, {start:13, end:17}, {start:0, end:17}], { color: '#00FF00', lineWidth: 4 });
                    window.drawLandmarks(canvasCtx, landmarks, { color: '#FF0000', lineWidth: 2 });

                    const ujungTelunjuk = landmarks[8].y;
                    const sendiTelunjuk = landmarks[6].y;
                    const ujungTengah = landmarks[12].y;
                    const sendiTengah = landmarks[10].y;
                    const ujungManis = landmarks[16].y;
                    const sendiManis = landmarks[14].y;
                    const ujungKelingking = landmarks[20].y;
                    const sendiKelingking = landmarks[18].y;

                    if (ujungTelunjuk < sendiTelunjuk && ujungTengah < sendiTengah && ujungManis > sendiManis && ujungKelingking > sendiKelingking) {
                        sedangPeaceSign = true;
                    }
                }

                if (sedangPeaceSign) {
                    video.classList.add("blur-effect");
                    statusDiv.innerText = "SENSOR AKTIF: Kamera Buram! ✌️";
                    statusDiv.style.backgroundColor = "#5a1a1a";
                    statusDiv.style.color = "#ff3333";
                } else {
                    video.classList.remove("blur-effect");
                    statusDiv.innerText = "Status: Kamera Normal (Deteksi Aktif)";
                    statusDiv.style.backgroundColor = "#2a2a35";
                    statusDiv.style.color = "#ffffff";
                }
            }
            window.requestAnimationFrame(jalankanDeteksi);
        }

        // Pemicu pertama: jalankan izin kamera duluan
        mintaIzinKameraDule();
    </script>
