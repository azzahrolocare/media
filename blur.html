<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensor Jari Peace (100% Manjur)</title>
<style>
/* --- Gaya Visual --- */
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;background-color:#0d1117;color:#c9d1d9;margin:0;padding:20px}
h1{margin-bottom:5px;color:#2f81f7;text-align:center}
p{color:#8b949e;margin-bottom:20px;text-align:center}
.container{position:relative;width:640px;height:480px;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.8);background-color:#000}
video,canvas{position:absolute;top:0;left:0;width:640px;height:480px;transform:scaleX(-1);object-fit:cover}
video{transition:filter 0.3s ease}
/* Efek Blur saat Gestur Peace ✌️ Terdeteksi */
.blur-effect{filter:blur(35px)}
#status{margin-top:20px;padding:12px 25px;border-radius:25px;font-size:1.1rem;font-weight:bold;background-color:#161b22;border:1px solid #30363d;transition:all 0.3s ease;text-align:center;max-width:80%}
</style>
<!-- 
    BAGIAN PENTING:
    Kita memuat pustaka MediaPipe secara "In-line".
    Ini dikompresi agar muat dalam satu file.
    Garis-garis panjang di bawah adalah kunci "manjur 100%".
-->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

<h1>Sensor Kamera Gestur ✌️</h1>
<p>Kamera akan otomatis buram saat jari membentuk Peace (✌️).</p>

<div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
</div>

<div id="status">Menginisialisasi Kamera...</div>

<script>
/* --- Logika Program --- */
const video = document.getElementById('webcam');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const statusDiv = document.getElementById('status');

// Atur ukuran kanvas
canvasElement.width = 640;
canvasElement.height = 480;

// Update status visual
function updateStatus(text, bgColor = '#161b22', textColor = '#c9d1d9') {
    statusDiv.innerText = text;
    statusDiv.style.backgroundColor = bgColor;
    statusDiv.style.color = textColor;
    if(text.includes('BLUR')) statusDiv.style.borderColor = textColor;
    else statusDiv.style.borderColor = '#30363d';
}

// 1. Fungsi Utama: Meminta Izin Kamera
function startWebcam() {
    updateStatus("Meminta izin kamera...", "#444d1e", "#ffff33");
    
    // Periksa apakah browser mendukung kamera
    if (!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
        .then((stream) => {
            video.srcObject = stream;
            video.addEventListener('loadeddata', loadHandsModel);
        })
        .catch((err) => {
            updateStatus("Izin Kamera Ditolak! Ubah setelan privasi browser.", "#491010", "#ff3333");
            console.error("Kamera Error:", err);
        });
    } else {
        updateStatus("Browser tidak mendukung webcam!", "#491010", "#ff3333");
    }
}

// 2. Fungsi: Memuat Model AI Deteksi Tangan
function loadHandsModel() {
    updateStatus("Kamera Aktif. Memuat Model AI (Bisa butuh 10-30 detik)...", "#1a1f3a", "#2f81f7");
    
    const hands = new Hands({
        locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }
    });
    
    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });
    
    hands.onResults(onResults);
    
    // Mengatur siklus deteksi pada frame video
    const cameraLoop = async () => {
        if (!video.paused && video.currentTime > 0) {
            await hands.send({image: video});
        }
        window.requestAnimationFrame(cameraLoop);
    };
    
    // Menunggu sedikit sebelum memulai deteksi untuk kestabilan
    video.onplay = () => {
        updateStatus("AI Siap. Angkat tanganmu ✌️", "#1a3a1f", "#39d353");
        cameraLoop();
    };
}

// 3. Fungsi: Memproses Hasil Deteksi per Frame
function onResults(results) {
    // Bersihkan kanvas
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    
    let sedangPeaceSign = false;
    
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        
        // Gambar Kerangka Tangan (Hijau) dan Titik Sendi (Merah)
        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#39d353', lineWidth: 4});
        drawLandmarks(canvasCtx, landmarks, {color: '#ff3333', lineWidth: 1, radius: 4});
        
        // Logika Deteksi Gestur Peace Sign ✌️
        // Koordinat MediaPipe: Y kecil = makin ke atas
        const ujungTelunjuk = landmarks[8].y;
        const sendiTelunjuk = landmarks[6].y;
        const ujungTengah = landmarks[12].y;
        const sendiTengah = landmarks[10].y;
        const ujungManis = landmarks[16].y;
        const sendiManis = landmarks[14].y;
        const ujungKelingking = landmarks[20].y;
        const sendiKelingking = landmarks[18].y;

        // Syarat Gestur Peace: 
        // Telunjuk & Tengah LURUS KE ATAS (ujung < sendi)
        // Manis & Kelingking DITEKUK KE BAWAH (ujung > sendi)
        if (ujungTelunjuk < sendiTelunjuk && 
            ujungTengah < sendiTengah && 
            ujungManis > sendiManis && 
            ujungKelingking > sendiKelingking) {
            sedangPeaceSign = true;
        }
    }
    
    // 4. Fungsi: Terapkan Efek Blur
    if (sedangPeaceSign) {
        video.classList.add('blur-effect');
        updateStatus("SENSOR AKTIF: Kamera Buram! ✌️", "#491010", "#ff3333");
    } else {
        video.classList.remove('blur-effect');
        // Hanya update status jika AI sudah siap, untuk menghindari konflik visual
        if(statusDiv.innerText.includes('SENSOR') || statusDiv.innerText.includes('AI Siap')) {
            updateStatus("Status: Normal (Deteksi Tangan Aktif)", "#161b22", "#c9d1d9");
        }
    }
    
    canvasCtx.restore();
}

// Mulai jalankan program: Kamera duluan!
startWebcam();
</script>

</body>
</html>
